<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI作品集：陪护小程序录屏展示与PDF内容预览。" />
    <title>AI作品集</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="label">AI Portfolio</span>
        <h1>AI作品集</h1>
        <a class="download" href="./assets/portfolio.pdf" download>下载原PDF</a>
      </header>

      <section class="video-section">
        <span class="label">Video Demo</span>
        <h2>陪护小程序录屏展示</h2>
        <div class="video-placeholder">
          <p>录屏文件较大，建议单独上传到 GitHub Release、网盘或视频平台。</p>
          <a href="#" aria-disabled="true">视频链接待添加</a>
        </div>
      </section>

      <section class="pdf-section">
        <span class="label">PDF Pages</span>
        <h2>PDF 内容预览</h2>
        <div class="pdf-pages">
          <figure class="pdf-page">
            <figcaption>
              <span>AI作品集 PDF</span>
              <strong>第 1 页</strong>
            </figcaption>
            <img src="./assets/pdf-page-1.png" alt="AI作品集PDF第1页" />
          </figure>
          <figure class="pdf-page">
            <figcaption>
              <span>AI作品集 PDF</span>
              <strong>第 2 页</strong>
            </figcaption>
            <img src="./assets/pdf-page-2.png" alt="AI作品集PDF第2页" />
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
