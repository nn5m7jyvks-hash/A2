<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI作品集：陪护小程序录屏展示与PDF内容预览。" />
    <title>AI作品集</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="label">AI Portfolio</span>
        <h1>AI作品集</h1>
        <a class="download" href="./assets/portfolio.pdf" download>下载原PDF</a>
      </header>

      <section class="video-section">
        <span class="label">Video Demo</span>
        <h2>陪护小程序录屏展示</h2>
        <div class="video-wrap">
          <video
            src="https://github.com/nn5m7jyvks-hash/A2/releases/download/v.01/default.mp4"
            controls
            playsinline
            preload="metadata"
          >
            当前浏览器不支持视频播放。
          </video>
        </div>
        <p class="hint">点击播放按钮即可查看录屏。</p>
      </section>

      <section class="pdf-section">
        <span class="label">PDF Pages</span>
        <h2>PDF 内容预览</h2>
        <div class="pdf-pages">
          <figure class="pdf-page">
            <figcaption>
              <span>AI作品集 PDF</span>
              <strong>第 1 页</strong>
            </figcaption>
            <img src="./assets/pdf-page-1.png" alt="AI作品集PDF第1页" />
          </figure>
          <figure class="pdf-page">
            <figcaption>
              <span>AI作品集 PDF</span>
              <strong>第 2 页</strong>
            </figcaption>
            <img src="./assets/pdf-page-2.png" alt="AI作品集PDF第2页" />
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
